<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap');
  /* Fonte do sistema — nada pra baixar, cada aparelho usa a fonte nativa
     dele: SF Pro no iPhone, Roboto no Android, Segoe no Windows. É o que dá
     aquela cara "app de fábrica" em vez de fonte "de web importada". */
  /* Tema escuro (padrão) — tons de azul-marinho da PMERJ */
  :root, :root[data-theme="dark"] {
    --bg: #0c1424; --bg-panel: #162545; --bg-chip: #1d2c4d; --bg-ghost: #1c2c4d;
    --bg-input: #0e1830; --bg-tabbar: #101b34; --border: #2a3d63;
    --text: #e8ecef; --text-muted: #9aa7b2; --text-muted-2: #7d8894; --text-dim: #5c6875;
  }
  /* Tema claro */
  :root[data-theme="light"] {
    --bg: #eef1f6; --bg-panel: #ffffff; --bg-chip: #e6ebf2; --bg-ghost: #e6ebf2;
    --bg-input: #ffffff; --bg-tabbar: #ffffff; --border: #d6dde6;
    --text: #16202e; --text-muted: #4d5866; --text-muted-2: #5f6b78; --text-dim: #8791a0;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); transition: background .15s ease; }
  * { box-sizing: border-box; }
  ::placeholder { color: var(--text-dim); }
  button { cursor: pointer; font-family: inherit; transition: transform .12s ease, filter .12s ease, background .15s ease, border-color .15s ease; }
  button:active { transform: scale(0.96); filter: brightness(0.94); }
  textarea, input { font-family: inherit; transition: border-color .15s ease, box-shadow .15s ease; }
  textarea:focus, input:focus { border-color: #c9a24a !important; box-shadow: 0 0 0 3px rgba(201,162,74,0.15); outline: none; }
  @keyframes mkFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes mkPop { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
  @keyframes mkSpin { to { transform: rotate(360deg); } }
  @keyframes mkSplashBar { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  .mk-panel { animation: mkFadeIn .16s ease-out both; }
  .mk-tabpage { animation: mkFadeIn .16s ease-out both; }
  .mk-card { animation: mkPop .14s ease-out both; }
  .mk-spinner { display: inline-block; width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(232,236,239,0.25); border-top-color: currentColor; animation: mkSpin .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a3d63; border-radius: 8px; }
</style>

<body>
<div id="root">
  <div style="min-height:100vh;background:#0c1424;color:#e8ecef;font-family:sans-serif;padding:24px;font-size:14px;">
    Carregando Mike Assist…
  </div>
</div>

<script>
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (root && root.textContent.indexOf("Carregando") !== -1) {
      root.innerHTML =
        '<div style="min-height:100vh;background:#0c1424;color:#e8ecef;font-family:sans-serif;padding:24px;font-size:14px;line-height:1.6;">' +
        '<strong style="color:#e3877a;">Erro ao carregar o Mike Assist</strong><br/><br/>' +
        'Mensagem: ' + (e.message || "desconhecida") + '<br/>' +
        'Arquivo: ' + (e.filename || "?") + '<br/>' +
        'Linha: ' + (e.lineno || "?") +
        '<br/><br/>Tire um print desta tela e envie para ajuste.</div>';
    }
  });

  setTimeout(function () {
    var root = document.getElementById("root");
    if (root && root.textContent.indexOf("Carregando") !== -1) {
      root.innerHTML =
        '<div style="min-height:100vh;background:#0c1424;color:#e8ecef;font-family:sans-serif;padding:24px;font-size:14px;line-height:1.6;">' +
        '<strong style="color:#c9a24a;">Demorando mais que o esperado</strong><br/><br/>' +
        'Os arquivos de suporte (React) podem estar bloqueados pela sua rede/operadora, ou a conexão está lenta.<br/><br/>' +
        'Tente: trocar de Wi-Fi para dados móveis (ou vice-versa), ou abrir em outro navegador.<br/><br/>' +
        'Se persistir, tire um print desta tela e envie para ajuste.</div>';
    }
  }, 8000);
</script>

function formatarTelefone(numero) {
  const d = numero.replace(/\D/g, "");
  if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return numero;
}

}

function extractJsonFromResponse(data) {
  // Se a Anthropic devolveu um erro (ex: modelo inválido, tool não habilitada,
  // limite de crédito), o formato é {"type":"error","error":{"message":...}}
  if (data.type === "error" || data.error) {
    const msg = typeof data.error === "string" ? data.error : (data.error?.message || "erro desconhecido");
    throw new Error(msg);
  }
  const textBlocks = (data.content || []).filter((b) => b.type === "text");
  if (textBlocks.length === 0) throw new Error("A resposta não trouxe texto (verifique o console do navegador para mais detalhes).");
  // Junta TODOS os blocos de texto (quando a IA usa busca com citações, a
  // resposta pode vir fragmentada em vários blocos intercalados).
  const joined = textBlocks.map((b) => b.text).join("\n");
  const cleaned = joined.replace(/```json|```/g, "").trim();
  // Extrai só o trecho entre a primeira { e a última }, ignorando qualquer
  // texto de comentário que a IA tenha colocado antes/depois do JSON.
  const inicio = cleaned.indexOf("{");
  const fim = cleaned.lastIndexOf("}");
  if (inicio === -1 || fim === -1 || fim < inicio) {
    throw new Error("A resposta não continha um JSON reconhecível.");
  }
  const jsonBruto = cleaned.slice(inicio, fim + 1);
  try {
    return JSON.parse(jsonBruto);
  } catch (e) {
    throw new Error("Não consegui interpretar a resposta da IA como JSON.");
  }
}

function extractPlainText(data) {
  if (data.type === "error" || data.error) {
    const msg = typeof data.error === "string" ? data.error : (data.error?.message || "erro desconhecido");
    throw new Error(msg);
  }
  const textBlocks = (data.content || []).filter((b) => b.type === "text");
  if (textBlocks.length === 0) throw new Error("A busca não retornou nenhum texto.");
  return textBlocks.map((b) => b.text).join("\n").trim();
}

        position: "absolute", bottom: "calc(env(safe-area-inset-bottom, 0px) + 40px)",
        width: 120, height: 3, borderRadius: 3, background: "var(--bg-chip)", overflow: "hidden",
      }}>
        <div style={{
          width: "45%", height: "100%", borderRadius: 3, background: "#c9a24a",
          animation: "mkSplashBar 1.1s ease-in-out infinite",
        }} />
      </div>
    </div>
  );
}

function MikeAssist() {
  const [activeTab, setActiveTab] = useState("redacao");
  const [loaded, setLoaded] = useState(false);

  // Tema claro/escuro — preferência salva só no aparelho (localStorage),
  // nunca em servidor. Padrão escuro (paleta PMERJ azul-marinho).
  const [tema, setTema] = useState(() => {
    try { return localStorage.getItem(TEMA_KEY) === "light" ? "light" : "dark"; }
    catch (e) { return "dark"; }
  });
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", tema);
    try { localStorage.setItem(TEMA_KEY, tema); } catch (e) {}
  }, [tema]);
  function alternarTema() {
    setTema((t) => (t === "dark" ? "light" : "dark"));
  }

  const [deviceId] = useState(getOrCreateDeviceId);

  const [profile, setProfile] = useState(emptyProfile);
  const [editingProfile, setEditingProfile] = useState(false);
  const [draftProfile, setDraftProfile] = useState(emptyProfile);

  const [relato, setRelato] = useState("");
  const [loading, setLoading] = useState(false);
  const [resultado, setResultado] = useState(null);
  const [error, setError] = useState("");
  const [copyLabel, setCopyLabel] = useState("Copiar");
  const [pixCopyLabel, setPixCopyLabel] = useState("Copiar chave Pix");

  const [avisos, setAvisos] = useState({});
  const [avisosLoading, setAvisosLoading] = useState(false);
  const [avisosError, setAvisosError] = useState("");
  const [forcandoAtualizacao, setForcandoAtualizacao] = useState(false);
  const [forcarMensagem, setForcarMensagem] = useState("");

  const [buscaTelefone, setBuscaTelefone] = useState("");

  const [legislacaoQuery, setLegislacaoQuery] = useState("");
  const [legislacaoLoading, setLegislacaoLoading] = useState(false);
  const [legislacaoFase, setLegislacaoFase] = useState("");
  const [legislacaoResultado, setLegislacaoResultado] = useState(null);
  const [legislacaoError, setLegislacaoError] = useState("");

  // Tempo mínimo de exibição da splash, pra não "piscar" quando os dados
  // locais carregam rápido demais — só efeito visual, não afeta velocidade
  // real do app (os dados já carregam em paralelo, isso só atrasa a troca
  // de tela por uma fração de segundo pra parecer intencional).
  const [splashMinDone, setSplashMinDone] = useState(false);
  useEffect(() => {
    const t = setTimeout(() => setSplashMinDone(true), 700);
    return () => clearTimeout(t);
  }, []);

  useEffect(() => {
    (async () => {
      const res = await storageGet(PROFILE_KEY);
      if (res) {
        const parsed = JSON.parse(res.value);
        setProfile(parsed);
        setDraftProfile(parsed);
      } else {
        setEditingProfile(true);
      }

      const resAvisos = await storageGet(AVISOS_KEY);
      if (resAvisos) {
        const parsedAvisos = JSON.parse(resAvisos.value);
        Object.keys(parsedAvisos).forEach((k) => {
          if (parsedAvisos[k].atualizadoEm) parsedAvisos[k].atualizadoEm = new Date(parsedAvisos[k].atualizadoEm);
        });
        setAvisos(parsedAvisos);
      }
      setLoaded(true);
      carregarAvisos();
    })();
  }, []);

  async function saveProfile() {
    setProfile(draftProfile);
    setEditingProfile(false);
    await storageSet(PROFILE_KEY, JSON.stringify(draftProfile));
  }

  const profileComplete = profile.nome && profile.rg;

  async function gerarHistorico() {
    if (!relato.trim()) return;
    setLoading(true); setError(""); setResultado(null);

    const systemPrompt = `Você é um assistente que ajuda policiais militares do Rio de Janeiro (PMERJ) a redigir o histórico de um BOPM (Boletim de Ocorrência da Polícia Militar) a partir de um relato informal.

Regras estritas:
- O relato do policial virá em linguagem informal, com gírias, abreviações e possíveis erros de gramática/digitação — normal para um relato rápido de campo. Sua função é corrigir a forma (gramática, formalidade, clareza) sem alterar os fatos narrados.
- Use linguagem natural de histórico policial, mas juridicamente correta — direto no fato, sem formalismo excessivo ou "encher linguiça". Narrativa em terceira pessoa, tempo verbal correto.
- NÃO inclua nome, graduação, RG, unidade ou dados da guarnição no texto do histórico. Esses dados já existem em campos próprios do portal oficial da PMERJ; o histórico deve focar exclusivamente na dinâmica do fato (o que aconteceu, como, quando, onde, com quem).
- NUNCA invente informação que o usuário não forneceu. Se um dado costuma ajudar a fundamentar esse tipo de ocorrência e não veio no relato, apenas sugira mencioná-lo — nunca em tom de exigência ou cobrança, é uma dica opcional, o policial decide se quer incluir.
- NUNCA invente nomes de sistemas, centrais ou jargões que não sejam reais. Se precisar referenciar a central de despacho, use "central 190", "CECOPOM" ou "Maré Zero" (apelido real usado por guarnições para o CECOPOM) — nunca invente nomenclatura. Na dúvida sobre algum termo técnico ou institucional, prefira uma descrição genérica e correta em vez de arriscar um nome que pode não existir.
- Use os exemplos abaixo (histórico de BOPM reais, com identificadores removidos) só como referência de ESTILO — vocabulário, tom, forma de estruturar o texto e de fechar a ocorrência. NUNCA copie nomes de setor (ex: "Setor Fox"), números de RO/BAM/matrícula/viatura ou qualquer outro dado desses exemplos para o histórico atual — cada ocorrência é única, use apenas o que veio no relato do policial:
${EXEMPLOS_HISTORICO_REAL}
- Prefira voz ativa a construções passivas. Ao final do histórico, quando fizer sentido, feche mencionando o encerramento e o destino (PTR, delegacia, hospital etc.) — mas NUNCA repita a expressão "patrulhamento de rotina" ou "PTR" duas vezes no mesmo texto.
- CASO ESPECIAL — relato genérico de patrulhamento sem nenhuma intercorrência: gere um histórico curto e direto informando que a guarnição patrulhou o local citado e nada foi constatado, sugerindo o código 80.004 (Nada constatado). Não alongue artificialmente.
- Seja objetivo e factual, sem opiniões.
- O texto gerado é um RASCUNHO de apoio; não é o BOPM oficial.
- Use como referência esta tabela de códigos de ocorrência da PMERJ (organizada por categoria) para sugerir o código mais apropriado. Algumas famílias de código aparecem como faixa (ex: "27.1xx") quando o documento oficial não detalha cada código individualmente — nesse caso, cite a faixa e oriente o policial a confirmar o número exato no Vade Mecum ou com a central, sem inventar um código específico:
${VADE_MECUM_SAMPLE}
- Se nenhum código da lista combinar bem, retorne o campo "codigo" como o valor JSON null (não a palavra "null" como texto).

Responda APENAS com um JSON válido, sem markdown, sem crases, no formato exato:
{"historico": "texto do histórico formatado", "codigo": "00.000 ou null", "codigo_descricao": "descrição do código ou null", "alertas": ["lista de sugestões opcionais do que poderia reforçar o histórico, cada uma uma frase curta e não-imperativa"]}`;

    try {
      const data = await callClaude(deviceId, { system: systemPrompt, messages: [{ role: "user", content: relato }] });
      setResultado(extractJsonFromResponse(data));
    } catch (e) {
      setError(`Não consegui gerar o histórico agora. ${e.message || ""}`);
    } finally {
      setLoading(false);
    }
  }

  async function copiarHistorico() {
    if (!resultado?.historico) return;
    try {
      await navigator.clipboard.writeText(resultado.historico);
      setCopyLabel("Copiado");
    } catch (e) {
      setCopyLabel("Erro ao copiar");
    }
    setTimeout(() => setCopyLabel("Copiar"), 1500);
  }

  async function copiarChavePix() {
    if (!PIX_KEY_DOACAO) return;
    try {
      await navigator.clipboard.writeText(PIX_KEY_DOACAO);
      setPixCopyLabel("Chave copiada!");
    } catch (e) {
      setPixCopyLabel("Erro ao copiar");
    }
    setTimeout(() => setPixCopyLabel("Copiar chave Pix"), 1500);
  }

  // As atualizações jurídicas agora são pré-calculadas no próprio Worker (via
  // Cron Trigger, algumas vezes ao dia) e guardadas prontas no KV — o app só
  // lê o resultado já pronto, então abre instantâneo em vez de disparar uma
  // busca + IA a cada pessoa que abre a aba.
  async function carregarAvisos() {
    setAvisosLoading(true);
    setAvisosError("");
    try {
      const resp = await fetch(`${WORKER_URL}/avisos`);
      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      const novoEstado = {};
      CATEGORIAS_AVISOS.forEach((categoria) => {
        const item = data[categoria.id];
        novoEstado[categoria.id] = {
          itens: (item && item.itens) || [],
          atualizadoEm: item && item.atualizadoEm ? new Date(item.atualizadoEm) : null,
          error: "",
        };
      });
      setAvisos(novoEstado);
      storageSet(AVISOS_KEY, JSON.stringify(novoEstado));
    } catch (e) {
      setAvisosError(`Não consegui carregar as atualizações agora. ${e.message || ""}`);
    } finally {
      setAvisosLoading(false);
    }
  }

  // Dispara uma geração nova agora (não espera o Cron Trigger), útil pra
  // testar a base pela primeira vez ou forçar uma atualização fora do
  // horário programado. Depois de disparar, espera um pouco e recarrega.
  async function forcarAtualizacao() {
    setForcandoAtualizacao(true);
    setForcarMensagem("");
    try {
      const resp = await fetch(`${WORKER_URL}/avisos/atualizar`, { method: "POST" });
      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      // As 3 categorias são geradas uma de cada vez no Worker (busca + IA +
      // pausa entre elas), então pode levar até ~1 minuto no total. Em vez de
      // recarregar uma única vez cedo demais, tenta a cada 10s por até 80s.
      setForcarMensagem("Atualização disparada — pode levar até 1 minuto. Pode navegar por outras abas enquanto isso, a busca continua rodando em segundo plano.");
      let tentativas = 0;
      const maxTentativas = 8;
      const verificar = async () => {
        tentativas += 1;
        await carregarAvisos();
        // Depois do carregarAvisos, o estado só é atualizado no próximo
        // render — então lemos direto da resposta pra decidir se já pronto.
        const resp2 = await fetch(`${WORKER_URL}/avisos`);
        const data2 = await resp2.json();
        const pronto = CATEGORIAS_AVISOS.every((c) => data2[c.id] && data2[c.id].atualizadoEm);
        if (pronto) {
          setForcarMensagem("Pronto! Atualizações geradas.");
          setTimeout(() => setForcarMensagem(""), 4000);
        } else if (tentativas < maxTentativas) {
          setForcarMensagem(`Ainda gerando… verificando de novo (${tentativas}/${maxTentativas}). Pode navegar por outras abas enquanto isso.`);
          setTimeout(verificar, 10000);
        } else {
          setForcarMensagem("Demorou mais que o esperado. Toque em \"Atualizar\" daqui a pouco pra conferir.");
        }
      };
      setTimeout(verificar, 10000);
    } catch (e) {
      setForcarMensagem(`Não consegui disparar a atualização. ${e.message || ""}`);
    } finally {
      setForcandoAtualizacao(false);
    }
  }

  async function buscarLegislacao() {
    if (!legislacaoQuery.trim()) return;
    setLegislacaoLoading(true); setLegislacaoFase("Pesquisando…"); setLegislacaoError(""); setLegislacaoResultado(null);

    const systemBusca = `Você ajuda um policial militar a consultar rapidamente qualquer legislação brasileira em vigor (federal ou estadual) relevante para sua atuação — não se limite a um código específico.

Use a ferramenta de busca para localizar a informação em fontes oficiais (prioridade: planalto.gov.br/ccivil_03, ou o site oficial do respectivo diploma legal).

Identifique corretamente de qual lei/código se trata (ex.: "Lei 11.343/2006 (Lei de Drogas)", não apenas "lei de drogas"). Traga o texto do artigo na ÍNTEGRA e literalmente — textos de lei são atos normativos oficiais, sem direito autoral. Depois, adicione uma explicação curta e prática (2-3 frases) do que isso significa na prática operacional do PM. Confirme que está em vigor; mencione alterações recentes relevantes. Escreva em texto livre, sem se preocupar com formato JSON aqui.

Se não encontrar nada confiável, diga isso claramente.`;

    const systemFormatar = (textoBruto) => `Converta o texto abaixo em um JSON válido (sem markdown, sem crases), no formato exato:
{"fonte": "nome da lei/código", "artigo": "número do(s) artigo(s)", "texto_lei": "texto literal do artigo (ou string vazia se não encontrado)", "explicacao": "explicação prática curta (ou a explicação de que não foi encontrado)"}

Texto para converter:
"""
${textoBruto}
"""`;

    try {
      const dataBusca = await callClaude(deviceId, {
        system: systemBusca,
        messages: [{ role: "user", content: legislacaoQuery }],
        tools: [{ type: "web_search_20250305", name: "web_search", max_uses: 1 }],
        maxTokens: 1200,
      });
      const textoBruto = extractPlainText(dataBusca);

      setLegislacaoFase("Organizando…");

      try {
        const dataFormatada = await callClaude(deviceId, {
          system: systemFormatar(textoBruto),
          messages: [{ role: "user", content: "Converta agora." }],
          maxTokens: 800,
          model: "claude-haiku-4-5-20251001",
        });
        setLegislacaoResultado(extractJsonFromResponse(dataFormatada));
      } catch (erroFormatacao) {
        // Se não conseguir estruturar em JSON, mostra o texto puro da busca
        setLegislacaoResultado({ fonte: "Busca", artigo: "", texto_lei: "", explicacao: textoBruto });
      }
    } catch (e) {
      setLegislacaoError(`Não consegui buscar agora. ${e.message || ""}`);
    } finally {
      setLegislacaoLoading(false);
    }
  }

  if (!loaded || !splashMinDone) return <SplashScreen />;

  return (
    <div style={styles.page}>
      <header style={styles.header}>
        <MikeIcon size={40} />
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div style={styles.appTitle}>Mike Assist</div>
            <span style={{
              fontSize: 10, fontWeight: 800, letterSpacing: 0.6, color: "#0c1424",
              background: "#c9a24a", borderRadius: 999, padding: "2px 8px", whiteSpace: "nowrap",
            }}>111 SÉRIE GOLD</span>
          </div>
          <div style={styles.appSubtitle}>assistente de BOPM &middot; PMERJ</div>
        </div>
        <button style={styles.themeToggle} onClick={alternarTema} title={tema === "dark" ? "Mudar para tema claro" : "Mudar para tema escuro"}>
          {tema === "dark" ? "☀️" : "🌙"}
        </button>
      </header>

      <nav style={styles.tabBar}>
        {[
          { id: "redacao", label: "BOPM" },
          { id: "avisos", label: "Jurídico" },
          { id: "consultas", label: "Consultas" },
          { id: "telefones", label: "Telefones" },
          { id: "legislacao", label: "Leis" },
        ].map((tab) => (
          <button key={tab.id} onClick={() => setActiveTab(tab.id)}
            style={{ ...styles.tabButton, ...(activeTab === tab.id ? styles.tabButtonActive : {}) }}>
            <TabIcon id={tab.id} active={activeTab === tab.id} />
            <span>{tab.label}</span>
          </button>
        ))}
      </nav>

      {activeTab === "redacao" && (
        <>
          <div className="mk-panel" style={styles.greetingBanner}>
            <div style={styles.greetingIcon}>📋</div>
            <div>
              <div style={styles.greetingTitle}>Bom serviço{profile.nome ? `, ${profile.nome}` : ""}!</div>
              <div style={styles.greetingMessage}>{mensagemDoDia()}</div>
            </div>
          </div>

          <section className="mk-panel" style={{ ...styles.panel, borderLeftColor: "#c9a24a" }}>
            {!editingProfile ? (
              <div>
                <div style={styles.panelLabel}>Guarnição do dia</div>
                {profileComplete ? (
                  <>
                    <div style={styles.profileRow}>
                      <span style={styles.profileName}>{profile.nome}</span>
                      <span style={styles.mono}>RG {profile.rg}</span>
                    </div>
                    <div style={styles.chipsRow}>
                      {[profile.unidade, profile.setor, profile.cop && `COP ${profile.cop}`, profile.horario]
                        .filter(Boolean).map((v, i) => <span key={i} style={styles.chip}>{v}</span>)}
                    </div>
                    {profile.componentes && profile.componentes.length > 0 && (
                      <div style={{ marginBottom: 12 }}>
                        <div style={styles.suggestionsLabel}>Demais componentes</div>
                        {profile.componentes.map((c, i) => (
                          <div key={i} style={styles.componenteRow}>
                            <span>{c.nome}</span>
                            {c.rg && <span style={styles.mono}>RG {c.rg}</span>}
                          </div>
                        ))}
                      </div>
                    )}
                  </>
                ) : <p style={styles.emptyText}>Nenhum perfil preenchido ainda.</p>}
                <button style={styles.ghostButton} onClick={() => { setDraftProfile(profile); setEditingProfile(true); }}>
                  Editar guarnição
                </button>
              </div>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <div style={styles.panelLabel}>Editar guarnição do dia</div>
                <Field label="Nome" value={draftProfile.nome} onChange={(v) => setDraftProfile({ ...draftProfile, nome: v })} placeholder="Sgt. Ricardo Almeida" />
                <Field label="RG / Matrícula" value={draftProfile.rg} onChange={(v) => setDraftProfile({ ...draftProfile, rg: v })} placeholder="123.456" mono />
                <Field label="Unidade" value={draftProfile.unidade} onChange={(v) => setDraftProfile({ ...draftProfile, unidade: v })} placeholder="3º BPM" />
                <Field label="Setor / guarnição" value={draftProfile.setor} onChange={(v) => setDraftProfile({ ...draftProfile, setor: v })} placeholder="Setor Fox · Moto Patrulha 1" />
                <Field label="Número da COP" value={draftProfile.cop} onChange={(v) => setDraftProfile({ ...draftProfile, cop: v })} placeholder="Ex.: 2130" mono />
                <Field label="Horário" value={draftProfile.horario} onChange={(v) => setDraftProfile({ ...draftProfile, horario: v })} placeholder="07h–19h" />
                <div style={{ marginTop: 4 }}>
                  <span style={styles.fieldLabel}>Demais componentes da guarnição</span>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 6 }}>
                    {(draftProfile.componentes || []).map((c, i) => (
                      <div key={i} style={{ display: "flex", gap: 6 }}>
                        <input value={c.nome} onChange={(e) => { const novos = [...draftProfile.componentes]; novos[i] = { ...novos[i], nome: e.target.value }; setDraftProfile({ ...draftProfile, componentes: novos }); }} placeholder="Nome" style={{ ...styles.input, flex: 2 }} />
                        <input value={c.rg} onChange={(e) => { const novos = [...draftProfile.componentes]; novos[i] = { ...novos[i], rg: e.target.value }; setDraftProfile({ ...draftProfile, componentes: novos }); }} placeholder="RG" style={{ ...styles.input, flex: 1, fontFamily: "'IBM Plex Mono', monospace" }} />
                        <button style={styles.removeButton} onClick={() => { const novos = draftProfile.componentes.filter((_, idx) => idx !== i); setDraftProfile({ ...draftProfile, componentes: novos }); }} aria-label="Remover">&#10005;</button>
                      </div>
                    ))}
                    <button style={styles.ghostButton} onClick={() => setDraftProfile({ ...draftProfile, componentes: [...(draftProfile.componentes || []), { nome: "", rg: "" }] })}>
                      + Adicionar componente
                    </button>
                  </div>
                </div>
                <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                  <button style={styles.primaryButton} onClick={saveProfile}>Salvar</button>
                  {profileComplete && <button style={styles.ghostButton} onClick={() => setEditingProfile(false)}>Cancelar</button>}
                </div>
              </div>
            )}
          </section>

          <section className="mk-panel" style={{ ...styles.panel, borderLeftColor: "#4f8f6d" }}>
            <div style={styles.panelLabel}>Descreva a ocorrência</div>
            <textarea value={relato} onChange={(e) => setRelato(e.target.value)}
              placeholder="Ex.: abordagem na Rua das Palmeiras, dois suspeitos, um estava com uma porção de maconha, resistência leve, conduzidos à 14ª DP."
              style={styles.textarea} rows={5} />
            <button style={{ ...styles.primaryButton, width: "100%", marginTop: 10, opacity: loading || !relato.trim() ? 0.6 : 1 }}
              onClick={gerarHistorico} disabled={loading || !relato.trim()}>
              {loading ? (<><span className="mk-spinner"></span>Gerando…</>) : "Gerar histórico"}
            </button>
            {error && <p style={styles.errorText}>{error}</p>}
          </section>

          {resultado && (
            <section className="mk-panel" style={{ ...styles.panel, borderLeftColor: "#5b8bc9" }}>
              <div style={styles.panelLabel}>Histórico gerado</div>
              <textarea value={resultado.historico} onChange={(e) => setResultado({ ...resultado, historico: e.target.value })} style={{ ...styles.textarea, minHeight: 140 }} />
              {resultado.codigo && resultado.codigo !== "null" && (
                <div style={styles.codeTag}>
                  <span style={styles.mono}>{resultado.codigo}</span>
                  <span style={{ opacity: 0.75 }}>{resultado.codigo_descricao}</span>
                </div>
              )}
              {resultado.alertas && resultado.alertas.length > 0 && (
                <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 6 }}>
                  <div style={styles.suggestionsLabel}>Pode valer reforçar (opcional)</div>
                  {resultado.alertas.map((a, i) => (
                    <div key={i} style={styles.alertRow}><span style={{ color: "#7d9bb0" }}>&#9679;</span><span>{a}</span></div>
                  ))}
                </div>
              )}
              <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                <button style={styles.primaryButton} onClick={copiarHistorico}>{copyLabel}</button>
                <button style={styles.ghostButton} onClick={gerarHistorico}>Regerar</button>
              </div>
              <p style={styles.disclaimer}>Rascunho de apoio. Revise e transcreva ao sistema oficial da corporação antes de formalizar.</p>
            </section>
          )}
        </>
      )}

      {activeTab === "avisos" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 8 }}>
            <button style={styles.smallGhostButton} onClick={forcarAtualizacao} disabled={forcandoAtualizacao}>
              {forcandoAtualizacao ? (<><span className="mk-spinner"></span>Disparando…</>) : "Forçar geração agora"}
            </button>
            <button style={styles.smallGhostButton} onClick={() => carregarAvisos()} disabled={avisosLoading}>
              {avisosLoading ? (<><span className="mk-spinner"></span>Carregando…</>) : "Atualizar"}
            </button>
          </div>
          {forcarMensagem && <p style={styles.timestamp}>{forcarMensagem}</p>}
          {avisosError && <p style={styles.errorText}>{avisosError}</p>}
          {CATEGORIAS_AVISOS.map((categoria) => {
            const estado = avisos[categoria.id] || {};
            return (
              <section key={categoria.id} className="mk-panel" style={{ ...styles.panel, borderLeftColor: categoria.cor }}>
                <div style={styles.sectionHeaderRow}>
                  <div style={styles.panelLabel}>{categoria.label}</div>
                  {estado.atualizadoEm && (
                    <span style={styles.sectionHeaderMeta}>Atualizado às {estado.atualizadoEm.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</span>
                  )}
                </div>
                {!estado.itens && avisosLoading && <p style={styles.emptyText}>Carregando…</p>}
                {estado.itens && estado.itens.length === 0 && !estado.atualizadoEm && (
                  <div style={styles.emptyBox}>Ainda não geramos essa categoria pela primeira vez. Toque em "Forçar geração agora" acima.</div>
                )}
                {estado.itens && estado.itens.length === 0 && estado.atualizadoEm && (
                  <div style={styles.emptyBox}>Nada de relevante encontrado por agora.</div>
                )}
                {estado.itens && estado.itens.length > 0 && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {estado.itens.map((item, i) => (
                      <div key={i} className="mk-card" style={styles.avisoCard}>
                        <span style={{ ...styles.avisoTag, background: categoria.cor }}>{item.fonte}</span>
                        <p style={styles.avisoTitulo}>{item.titulo}</p>
                        <p style={styles.avisoResumo}>{item.resumo}</p>
                        {item.url && item.url !== "null" && <a href={item.url} target="_blank" rel="noreferrer" style={styles.sourceLink}>Ver fonte →</a>}
                      </div>
                    ))}
                  </div>
                )}
              </section>
            );
          })}
        </div>
      )}

      {activeTab === "consultas" && (
        <section className="mk-panel" style={{ ...styles.panel, borderLeftColor: "#8a8f98" }}>
          <div style={styles.panelLabel}>Consultas oficiais</div>
          <div style={{ display: "flex", gap: 8 }}>
            <a href="https://portalbnmp.cnj.jus.br/#/captcha//pesquisa-peca" target="_blank" rel="noreferrer" style={styles.linkButton}>BNMP</a>
            <a href="https://play.google.com/store/apps/details?id=br.gov.sinesp.cidadao.android" target="_blank" rel="noreferrer" style={styles.linkButton}>SINESP Cidadão</a>
          </div>
          <p style={styles.disclaimer}>As consultas acontecem no site/app oficial, autenticadas por você. Nenhum dado passa pelo Mike Assist.</p>
        </section>
      )}

      {activeTab === "consultas" && (
        <section className="mk-panel" style={{ ...styles.panel, borderLeftColor: "#4f8f6d" }}>
          <div style={styles.panelLabel}>Sugestões</div>
          <a
            href="mailto:mikeassist.suporte@gmail.com?subject=Sugest%C3%A3o%20-%20Mike%20Assist&body=Sugest%C3%A3o%2Fideia%3A%0A%0A"

            <div style={{
              width: 42, height: 42, borderRadius: "50%", flexShrink: 0,
              background: "rgba(79,143,109,0.16)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 19,
            }}>
              🛡️
            </div>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 15, fontWeight: 700 }}>
                Suporte
                <span style={{
                  display: "inline-flex", alignItems: "center", justifyContent: "center",
                  width: 15, height: 15, borderRadius: "50%", background: "#5b8bc9",
                  color: "#fff", fontSize: 9, fontWeight: 700, lineHeight: 1,
                }}>✓</span>
              </div>
              <div style={{ fontSize: 12.5, color: "var(--text-muted)", marginTop: 1 }}>Fale com o suporte</div>
            </div>
          </a>
        </section>
      )}

      {activeTab === "consultas" && PIX_KEY_DOACAO && (
        <section className="mk-panel" style={{ ...styles.panel, borderLeftColor: "#c9a24a" }}>
          <div style={styles.panelLabel}>Apoie o projeto</div>
          <p style={{ fontSize: 13, color: "#c3cbd3", lineHeight: 1.6, margin: "6px 0 10px" }}>
            Se isso te ajudou, deixe um café pro guarda ☕
          </p>
          <button style={{ ...styles.primaryButton, width: "100%" }} onClick={copiarChavePix}>
            {pixCopyLabel}
          </button>
          <p style={styles.disclaimer}>Doação totalmente opcional, via Pix. Nenhum recurso do app é liberado em troca — é só um cafezinho, se você quiser.</p>
        </section>
      )}

      {activeTab === "telefones" && (
        <section className="mk-panel" style={{ ...styles.panel, borderLeftColor: "#5b8bc9" }}>
          <div style={styles.panelLabel}>Telefones das unidades</div>
          <div style={{ ...styles.emptyBox, padding: "26px 12px" }}>
            <div style={{ fontSize: 26, marginBottom: 8 }}>☎️</div>
            <div style={{ fontSize: 14, fontWeight: 700, color: "var(--text)" }}>Em breve</div>
            <p style={{ fontSize: 12.5, marginTop: 6, lineHeight: 1.6 }}>
              Estamos conferindo os contatos das unidades antes de disponibilizar essa lista.
            </p>
          </div>
        </section>
      )}

      {activeTab === "legislacao" && (
        <section className="mk-panel" style={{ ...styles.panel, borderLeftColor: "#a13b46" }}>
          <div style={styles.panelLabel}>Consultar legislação em vigor</div>
          <input value={legislacaoQuery} onChange={(e) => setLegislacaoQuery(e.target.value)}
            placeholder="Ex.: art. 302 CPP, porte de droga, Lei Maria da Penha, ECA guarda"
            style={{ ...styles.input, width: "100%", marginTop: 8 }}
            onKeyDown={(e) => e.key === "Enter" && buscarLegislacao()} />
          <button style={{ ...styles.primaryButton, width: "100%", marginTop: 10, opacity: legislacaoLoading || !legislacaoQuery.trim() ? 0.6 : 1 }}
            onClick={buscarLegislacao} disabled={legislacaoLoading || !legislacaoQuery.trim()}>
            {legislacaoLoading ? (<><span className="mk-spinner"></span>{legislacaoFase || "Buscando…"}</>) : "Buscar"}
          </button>
          {legislacaoError && <p style={styles.errorText}>{legislacaoError}</p>}
          {legislacaoResultado && (
            <div style={{ marginTop: 12 }}>
              {legislacaoResultado.texto_lei ? (
                <>
                  <div style={styles.codeTag}>
                    <span style={styles.mono}>{legislacaoResultado.fonte}</span>
                    <span style={{ opacity: 0.75 }}>{legislacaoResultado.artigo}</span>
                  </div>
                  <div style={styles.leiTexto}>{legislacaoResultado.texto_lei}</div>
                  {legislacaoResultado.explicacao && (
                    <div style={{ marginTop: 10 }}>
                      <div style={styles.suggestionsLabel}>Na prática</div>
                      <p style={styles.avisoResumo}>{legislacaoResultado.explicacao}</p>
                    </div>
                  )}
                </>
              ) : <p style={styles.emptyText}>{legislacaoResultado.explicacao}</p>}
            </div>
          )}
          <p style={styles.disclaimer}>Busca abrange qualquer lei federal ou estadual em vigor, em fontes oficiais. Sempre confira a redação vigente antes de citar formalmente.</p>
        </section>
      )}
    </div>
  );
}
