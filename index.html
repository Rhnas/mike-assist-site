<style>

  /* Fonte do sistema — nada pra baixar, cada aparelho usa a fonte nativa
     dele: SF Pro no iPhone, Roboto no Android, Segoe no Windows. É o que dá
     aquela cara "app de fábrica" em vez de fonte "de web importada". */
  /* Tema escuro (padrão) — tons de azul-marinho da PMERJ */
  :root, :root[data-theme="dark"] {
    --bg: #0c1424; --bg-panel: #162545; --bg-chip: #1d2c4d; --bg-ghost: #1c2c4d;
    --bg-input: #0e1830; --bg-tabbar: #101b34; --border: #2a3d63;
    --text: #e8ecef; --text-muted: #9aa7b2; --text-muted-2: #7d8894; --text-dim: #5c6875;
  }
  /* Tema claro */
  :root[data-theme="light"] {
    --bg: #eef1f6; --bg-panel: #ffffff; --bg-chip: #e6ebf2; --bg-ghost: #e6ebf2;
    --bg-input: #ffffff; --bg-tabbar: #ffffff; --border: #d6dde6;
    --text: #16202e; --text-muted: #4d5866; --text-muted-2: #5f6b78; --text-dim: #8791a0;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); transition: background .15s ease; }
  * { box-sizing: border-box; }
  ::placeholder { color: var(--text-dim); }
  button { cursor: pointer; font-family: inherit; transition: transform .12s ease, filter .12s ease, background .15s ease, border-color .15s ease; }
  button:active { transform: scale(0.96); filter: brightness(0.94); }
  textarea, input { font-family: inherit; transition: border-color .15s ease, box-shadow .15s ease; }
  textarea:focus, input:focus { border-color: #c9a24a !important; box-shadow: 0 0 0 3px rgba(201,162,74,0.15); outline: none; }
  @keyframes mkFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes mkPop { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
  @keyframes mkSpin { to { transform: rotate(360deg); } }
  @keyframes mkSplashBar { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  .mk-panel { animation: mkFadeIn .16s ease-out both; }
  .mk-tabpage { animation: mkFadeIn .16s ease-out both; }
  .mk-card { animation: mkPop .14s ease-out both; }
  .mk-spinner { display: inline-block; width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(232,236,239,0.25); border-top-color: currentColor; animation: mkSpin .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a3d63; border-radius: 8px; }
</style>

<div id="root">
  <div style="min-height:100vh;background:#0c1424;color:#e8ecef;font-family:sans-serif;padding:24px;font-size:14px;">
    Carregando Mike Assist…
  </div>
</div>

<script>
  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (root && root.textContent.indexOf("Carregando") !== -1) {
      root.innerHTML =
        '<div style="min-height:100vh;background:#0c1424;color:#e8ecef;font-family:sans-serif;padding:24px;font-size:14px;line-height:1.6;">' +
        '<strong style="color:#e3877a;">Erro ao carregar o Mike Assist</strong><br/><br/>' +
        'Mensagem: ' + (e.message || "desconhecida") + '<br/>' +
        'Arquivo: ' + (e.filename || "?") + '<br/>' +
        'Linha: ' + (e.lineno || "?") +
        '<br/><br/>Tire um print desta tela e envie para ajuste.</div>';
    }
  });

  setTimeout(function () {
    var root = document.getElementById("root");
    if (root && root.textContent.indexOf("Carregando") !== -1) {
      root.innerHTML =
        '<div style="min-height:100vh;background:#0c1424;color:#e8ecef;font-family:sans-serif;padding:24px;font-size:14px;line-height:1.6;">' +
        '<strong style="color:#c9a24a;">Demorando mais que o esperado</strong><br/><br/>' +
        'Os arquivos de suporte (React) podem estar bloqueados pela sua rede/operadora, ou a conexão está lenta.<br/><br/>' +
        'Tente: trocar de Wi-Fi para dados móveis (ou vice-versa), ou abrir em outro navegador.<br/><br/>' +
        'Se persistir, tire um print desta tela e envie para ajuste.</div>';
    }
  }, 8000);
</script>

--- exemplo 1 (desentendimento familiar) ---
Guarnição do Setor Fox procedeu à ocorrência paga por Maré Zero, inicialmente relacionada a desentendimento familiar. No local, após contato com os envolvidos, verificou-se tratar de divergência familiar envolvendo questões relacionadas a imóvel, herança e obra realizada em terreno onde existe uma servidão utilizada para acesso a quatro residências.
Segundo informado, um dos envolvidos alega possuir procuração com assinatura do pai da solicitante, relacionada às questões envolvendo o imóvel. A solicitante, moradora da primeira residência, informou que seu pai atualmente se encontra em estado de demência, havendo divergências entre os familiares acerca da situação patrimonial e da utilização do terreno.
A solicitante informou ainda possuir medida protetiva em face de um dos envolvidos. Cabe ressaltar que as partes residem em imóveis contíguos, lado a lado, havendo apenas a própria estrutura/muro das residências como separação física entre elas. No documento apresentado à guarnição, não foi observada especificação de distância mínima de afastamento ou outra determinação específica relacionada à proximidade entre as respectivas residências.
Durante a atuação da guarnição, a situação apresentada restringiu-se a atrito verbal decorrente das divergências familiares, não sendo constatada agressão física ou outra situação que demandasse intervenção imediata naquele momento.
Diante dos fatos, as partes foram devidamente orientadas quanto à necessidade de buscar os meios legais competentes para resolução das questões relativas ao imóvel, herança, procuração, servidão e obra. Cessado o atrito verbal e não sendo constatada, naquele momento, outra situação que exigisse providência imediata da guarnição, a ocorrência foi encerrada no local após as devidas orientações.

--- exemplo 2 (possíveis maus-tratos a menor) ---
Guarnição do Setor Fox procedeu ao local para averiguar ocorrência inicialmente informada como possível situação envolvendo maus-tratos a menor de 9 anos, tendo sido relatado na solicitação que a tia teria colocado a criança para fora da residência, impedido seu retorno e que supostamente a agrediria.
No local, a guarnição fez contato com os envolvidos, constatando que a tia reside no mesmo imóvel que a mãe do menor e auxilia nos cuidados da família. Segundo relato da tia, tanto a mãe quanto o menor apresentam distúrbios, sendo ainda informado por ela que a criança já teria saído da residência sem autorização em outras oportunidades e que, em razão de sua condição, por vezes apresentaria relatos que, segundo a declarante, não corresponderiam à realidade. Ressalta-se que tais informações correspondem exclusivamente à versão apresentada pela tia.
Durante o atendimento, a guarnição manteve contato com o menor, não sendo visualizadas naquele momento lesões ou marcas aparentes que indicassem agressão física, tampouco foram percebidas manifestações aparentes de temor da criança em relação à tia. O menor retornou ao interior da residência, não havendo resistência por parte da tia quanto à sua entrada.
Diante das circunstâncias efetivamente constatadas pela guarnição naquele momento, não foram identificados elementos aparentes que confirmassem a situação de agressão narrada inicialmente na solicitação. As partes foram devidamente orientadas, permanecendo o menor no interior da residência juntamente com seus familiares, sendo a ocorrência encerrada no local, sem outras alterações observadas pela guarnição.

--- exemplo 3 (acidente de trânsito com vítima, envolve perícia/DP — identificadores anonimizados) ---
Guarnição do Setor Fox foi empenhada em ocorrência de acidente de trânsito com vítima, tratando-se de colisão com veículo parado.
Ao chegar, constatou-se que o cenário do acidente já se encontrava desfeito, não sendo possível verificar a posição original dos veículos ou outros elementos relacionados à dinâmica do fato. Encontrava-se presente equipe do CBMERJ, viatura [nº da ASE], tendo como mais antigo o [posto/graduação e nome], RG [nº].
O condutor da motocicleta, [nome], qualificado neste BOPM, estava sob os cuidados do CBMERJ, sendo posteriormente conduzido ao [hospital], onde foi gerado o BAM nº [nº]. [Familiar], também qualificado(a), permaneceu como seu(sua) representante. A motocicleta envolvida ficou acautelada sob a responsabilidade de [nome], [grau de parentesco] do condutor.
Quanto ao [outro veículo envolvido], foi constatado que este se encontrava enguiçado. [Nome] apresentou-se à guarnição como seu condutor, acompanhado de [nome], que se identificou como proprietário do veículo e empregador do condutor. O veículo permaneceu sob a responsabilidade de seu proprietário.
Após as providências iniciais, a equipe deslocou-se ao [hospital], onde, em contato com os profissionais responsáveis pelo atendimento, foi informada de que a vítima se encontrava fora de risco de vida.
Em seguida, os fatos foram apresentados na [nº]ª DP, sendo confeccionado o RO nº [nº]. Embora não houvesse vítima fatal e o cenário já estivesse desfeito quando da chegada da equipe, o inspetor responsável solicitou a realização de perícia.
Em cumprimento à solicitação, a guarnição retornou ao local. Às [hora], compareceu o perito [nome], matrícula nº [nº], na viatura nº [nº], realizando os procedimentos periciais, já sem a presença dos veículos envolvidos.
Ressalta-se que a guarnição não presenciou o acidente e encontrou o cenário já desfeito, não sendo possível estabelecer sua dinâmica ou atribuir responsabilidade aos envolvidos, limitando-se às constatações realizadas, às informações prestadas e às providências adotadas.
Concluídos os trabalhos periciais e não havendo outras providências a cargo da guarnição, a ocorrência foi encerrada.

--- exemplo 4 (perturbação do sossego) ---
Guarnição do Setor Fox procedeu ao local para atendimento de ocorrência de perturbação do trabalho e do sossego. Ao chegar ao endereço indicado, o solicitante não se apresentou à guarnição.
No local, foi identificado o responsável pelo evento, sendo realizada a devida orientação quanto ao volume do som e aos possíveis transtornos causados à vizinhança. O responsável mostrou-se receptivo às orientações, comprometendo-se a reduzir imediatamente o volume e a encerrar o evento em breve.
Diante da situação e não havendo outras alterações no momento, a ocorrência foi encerrada no local após as devidas orientações.

--- exemplo 5 (possível violência doméstica, sem lesão relatada) ---
Guarnição do Setor Fox recebeu solicitação para atendimento de ocorrência inicialmente informada como violência doméstica contra a mulher, com possível lesão corporal.
Ao chegar ao local, a guarnição fez contato com a solicitante, a qual relatou que desejava que seu ex-marido deixasse a residência, mencionando apenas a ocorrência de atrito verbal entre as partes. Durante o atendimento, não foi relatada pela solicitante qualquer agressão física.
Após contato e orientação de ambas as partes, o homem retirou alguns de seus pertences pessoais e deixou a residência voluntariamente, cessando o desentendimento.
Diante da situação constatada no local e não havendo outras alterações naquele momento, a ocorrência foi encerrada no local após as devidas orientações às partes.

--- exemplo 6 (possível lesão corporal contra mulher, sem lesão constatada) ---
Guarnição do Setor Fox procedeu ao local para averiguar ocorrência inicialmente informada como lesão corporal contra mulher.
Ao chegar ao endereço, a guarnição deparou-se com o casal em atrito verbal, sendo relatado por ambas as partes que houve troca de insultos durante a discussão.
A solicitante manifestou não se sentir confortável com a permanência de seu marido na residência, solicitando que ele deixasse o imóvel. O referido, que se encontrava no local, concordou em sair voluntariamente, cessando, naquele momento, o atrito entre as partes.
A solicitante recebeu as devidas orientações e informou que, pela manhã, acompanhada de sua mãe, compareceria à Delegacia de Atendimento à Mulher para relatar os fatos e adotar as providências que entendesse cabíveis.
Diante da saída voluntária do marido e da cessação do conflito naquele momento, a ocorrência foi encerrada no local, após as devidas orientações.
`.trim();

function formatarTelefone(numero) {
  const d = numero.replace(/\D/g, "");
  if (d.length === 11) return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
  return numero;
}

// ---------- Chamada ao backend (proxy) em vez de direto à Anthropic ----------
async function callClaude(deviceId, { system, messages, tools, maxTokens = 1000, model }) {
  const response = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system, messages, tools, maxTokens, deviceId, model }),
  });
  try {
    return await response.json();
  } catch (e) {
    throw new Error(`Resposta inválida do servidor (${response.status}).`);
  }
}

// Traduz erros técnicos (rede, limite, servidor) em mensagens que o policial entende.
// Só aceita links http(s) válidos. Corrige o caso "www.portal." (ex.: STF),
// que não existe e dava "site não encontrado".
function urlSegura(bruto) {
  try {
    const u = new URL(String(bruto));
    if (u.protocol !== "https:" && u.protocol !== "http:") return null;
    if (u.hostname.startsWith("www.portal.")) u.hostname = u.hostname.slice(4);
    return u.toString();
  } catch (e) { return null; }
}

function friendlyError(e) {
  console.error(e);
  if (typeof navigator !== "undefined" && navigator.onLine === false) return "Sem conexão com a internet. Confira o sinal e tente de novo.";
  const msg = (e && e.message) || "";
  if (/failed to fetch|networkerror|load failed/i.test(msg)) return "Não consegui conectar ao servidor. Confira a internet e tente de novo.";
  // Mensagens de limite escritas pelo servidor (limite diário, tamanho do texto) já são claras.
  if (/limite di[aá]rio|limite de uso|grande demais|máximo de/i.test(msg)) return msg;
  if (/rate|limit|429|overload|credit|quota|saldo/i.test(msg)) return "O serviço está com muito uso agora. Tente de novo em alguns minutos.";
  return "Não consegui gerar o histórico agora. Tente de novo em instantes.";
}

function getOrCreateDeviceId() {
  let id = localStorage.getItem(DEVICE_ID_STORAGE);
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : `dev-${Date.now()}-${Math.random().toString(36).slice(2)}`);
    localStorage.setItem(DEVICE_ID_STORAGE, id);
  }
  return id;
}

function extractJsonFromResponse(data) {
  // Se a Anthropic devolveu um erro (ex: modelo inválido, tool não habilitada,
  // limite de crédito), o formato é {"type":"error","error":{"message":...}}
  if (data.type === "error" || data.error) {
    const msg = typeof data.error === "string" ? data.error : (data.error?.message || "erro desconhecido");
    throw new Error(msg);
  }
  const textBlocks = (data.content || []).filter((b) => b.type === "text");
  if (textBlocks.length === 0) throw new Error("A resposta não trouxe texto (verifique o console do navegador para mais detalhes).");
  // Junta TODOS os blocos de texto (quando a IA usa busca com citações, a
  // resposta pode vir fragmentada em vários blocos intercalados).
  const joined = textBlocks.map((b) => b.text).join("\n");
  const cleaned = joined.replace(/```json|```/g, "").trim();
  // Extrai só o trecho entre a primeira { e a última }, ignorando qualquer
  // texto de comentário que a IA tenha colocado antes/depois do JSON.
  const inicio = cleaned.indexOf("{");
  const fim = cleaned.lastIndexOf("}");
  if (inicio === -1 || fim === -1 || fim < inicio) {
    throw new Error("A resposta não continha um JSON reconhecível.");
  }
  const jsonBruto = cleaned.slice(inicio, fim + 1);
  try {
    return JSON.parse(jsonBruto);
  } catch (e) {
    throw new Error("Não consegui interpretar a resposta da IA como JSON.");
  }
}

function extractPlainText(data) {
  if (data.type === "error" || data.error) {
    const msg = typeof data.error === "string" ? data.error : (data.error?.message || "erro desconhecido");
    throw new Error(msg);
  }
  const textBlocks = (data.content || []).filter((b) => b.type === "text");
  if (textBlocks.length === 0) throw new Error("A busca não retornou nenhum texto.");
  return textBlocks.map((b) => b.text).join("\n").trim();
}

  return (
    <div style={{
      position: "fixed", inset: 0, background: "var(--bg)",
      display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 18,
    }}>
      <MikeIcon size={84} />
      <div style={{ textAlign: "center" }}>
        <div style={{ fontSize: 26, fontWeight: 800, color: "var(--text)", letterSpacing: -0.3 }}>Mike Assist</div>
        <div style={{ fontSize: 11, fontWeight: 700, color: "#c9a24a", letterSpacing: 2.5, marginTop: 6 }}>
          111 SÉRIE GOLD
        </div>
        <div style={{ fontSize: 11.5, fontWeight: 600, color: "var(--text-dim)", letterSpacing: 2, marginTop: 6 }}>
          ASSISTENTE DE BOPM · PMERJ
        </div>
      </div>
      <div style={{
        position: "absolute", bottom: "calc(env(safe-area-inset-bottom, 0px) + 40px)",

      }}>

          width: "45%", height: "100%", borderRadius: 3, background: "#c9a24a",

  );
}

function MikeAssist() {
  const [activeTab, setActiveTab] = useState("redacao");
  const [loaded, setLoaded] = useState(false);

  // Tema claro/escuro — preferência salva só no aparelho (localStorage),
  // nunca em servidor. Padrão escuro (paleta PMERJ azul-marinho).
  const [tema, setTema] = useState(() => {
    try { return localStorage.getItem(TEMA_KEY) === "light" ? "light" : "dark"; }
    catch (e) { return "dark"; }
  });
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", tema);
    try { localStorage.setItem(TEMA_KEY, tema); } catch (e) {}
  }, [tema]);
  function alternarTema() {
    setTema((t) => (t === "dark" ? "light" : "dark"));
  }

  const [deviceId] = useState(getOrCreateDeviceId);

  const [profile, setProfile] = useState(emptyProfile);
  const [editingProfile, setEditingProfile] = useState(false);
  const [draftProfile, setDraftProfile] = useState(emptyProfile);

  const [relato, setRelato] = useState("");
  const [loading, setLoading] = useState(false);

    if (!relato.trim()) return;
    setLoading(true); setError(""); setResultado(null);

    const systemPrompt = `Você é um assistente que ajuda policiais militares do Rio de Janeiro (PMERJ) a redigir o histórico de um BOPM (Boletim de Ocorrência da Polícia Militar) a partir de um relato informal.

Regras estritas:
- O relato do policial virá em linguagem informal, com gírias, abreviações e possíveis erros de gramática/digitação — normal para um relato rápido de campo. Sua função é corrigir a forma (gramática, formalidade, clareza) sem alterar os fatos narrados.
- Use linguagem natural de histórico policial, mas juridicamente correta — direto no fato, sem formalismo excessivo ou "encher linguiça". Narrativa em terceira pessoa, tempo verbal correto.
- NÃO inclua nome, graduação, RG, unidade ou dados da guarnição no texto do histórico. Esses dados já existem em campos próprios do portal oficial da PMERJ; o histórico deve focar exclusivamente na dinâmica do fato (o que aconteceu, como, quando, onde, com quem).
- NUNCA invente informação que o usuário não forneceu. Se um dado costuma ajudar a fundamentar esse tipo de ocorrência e não veio no relato, apenas sugira mencioná-lo — nunca em tom de exigência ou cobrança, é uma dica opcional, o policial decide se quer incluir.
- NUNCA invente nomes de sistemas, centrais ou jargões que não sejam reais. Se precisar referenciar a central de despacho, use "central 190", "CECOPOM" ou "Maré Zero" (apelido real usado por guarnições para o CECOPOM) — nunca invente nomenclatura. Na dúvida sobre algum termo técnico ou institucional, prefira uma descrição genérica e correta em vez de arriscar um nome que pode não existir.
- Use os exemplos abaixo (histórico de BOPM reais, com identificadores removidos) só como referência de ESTILO — vocabulário, tom, forma de estruturar o texto e de fechar a ocorrência. NUNCA copie nomes de setor (ex: "Setor Fox"), números de RO/BAM/matrícula/viatura ou qualquer outro dado desses exemplos para o histórico atual — cada ocorrência é única, use apenas o que veio no relato do policial:
${EXEMPLOS_HISTORICO_REAL}
- Prefira voz ativa a construções passivas. Ao final do histórico, quando fizer sentido, feche mencionando o encerramento e o destino (PTR, delegacia, hospital etc.) — mas NUNCA repita a expressão "patrulhamento de rotina" ou "PTR" duas vezes no mesmo texto.
- CASO ESPECIAL — relato genérico de patrulhamento sem nenhuma intercorrência: gere um histórico curto e direto informando que a guarnição patrulhou o local citado e nada foi constatado, sugerindo o código 80.004 (Nada constatado). Não alongue artificialmente.
- Seja objetivo e factual, sem opiniões.
- O texto gerado é um RASCUNHO de apoio; não é o BOPM oficial.
- Use como referência esta tabela de códigos de ocorrência da PMERJ (organizada por categoria) para sugerir o código mais apropriado. Algumas famílias de código aparecem como faixa (ex: "27.1xx") quando o documento oficial não detalha cada código individualmente — nesse caso, cite a faixa e oriente o policial a confirmar o número exato no Vade Mecum ou com a central, sem inventar um código específico:
${VADE_MECUM_SAMPLE}
- Se nenhum código da lista combinar bem, retorne o campo "codigo" como o valor JSON null (não a palavra "null" como texto).

Responda APENAS com um JSON válido, sem markdown, sem crases, no formato exato:
{"historico": "texto do histórico formatado", "codigo": "00.000 ou null", "codigo_descricao": "descrição do código ou null", "alertas": ["lista de sugestões opcionais do que poderia reforçar o histórico, cada uma uma frase curta e não-imperativa"]}`;

    try {
      const data = await callClaude(deviceId, { system: systemPrompt, messages: [{ role: "user", content: relato }] });
      setResultado(extractJsonFromResponse(data));
    } catch (e) {
      setError(friendlyError(e));
    } finally {
      setLoading(false);
    }
  }

  // As atualizações jurídicas agora são pré-calculadas no próprio Worker (via

  // lê o resultado já pronto, então abre instantâneo em vez de disparar uma
  // busca + IA a cada pessoa que abre a aba.
  async function carregarAvisos() {
    setAvisosLoading(true);
    setAvisosError("");
    try {
      const resp = await fetch(`${WORKER_URL}/avisos`);
      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      const novoEstado = {};
      CATEGORIAS_AVISOS.forEach((categoria) => {
        const item = data[categoria.id];
        novoEstado[categoria.id] = {
          itens: (item && item.itens) || [],
          atualizadoEm: item && item.atualizadoEm ? new Date(item.atualizadoEm) : null,
          error: "",
        };
      });
      setAvisos(novoEstado);
      storageSet(AVISOS_KEY, JSON.stringify(novoEstado));
    } catch (e) {
      setAvisosError(`Não consegui carregar as atualizações agora. ${e.message || ""}`);
    } finally {
      setAvisosLoading(false);
    }
  }

  // Dispara uma geração nova agora (não espera o Cron Trigger), útil pra
  // testar a base pela primeira vez ou forçar uma atualização fora do
  // horário programado. Depois de disparar, espera um pouco e recarrega.
  async function forcarAtualizacao() {
    // O Worker exige o token de administrador (segredo ADMIN_TOKEN na Cloudflare).
    // Ele é digitado na hora e nunca fica salvo no código nem no aparelho.
    const token = window.prompt("Token de administrador:");
    if (!token) return;
    setForcandoAtualizacao(true);
    setForcarMensagem("");
    try {
      const resp = await fetch(`${WORKER_URL}/avisos/atualizar`, { method: "POST", headers: { "X-Admin-Token": token } });
      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      // As 3 categorias são geradas uma de cada vez no Worker (busca + IA +
      // pausa entre elas), então pode levar até ~1 minuto no total. Em vez de
      // recarregar uma única vez cedo demais, tenta a cada 10s por até 80s.
      setForcarMensagem("Atualização disparada — pode levar até 1 minuto. Pode navegar por outras abas enquanto isso, a busca continua rodando em segundo plano.");
      let tentativas = 0;
      const maxTentativas = 8;
      const verificar = async () => {
        tentativas += 1;
        await carregarAvisos();
        // Depois do carregarAvisos, o estado só é atualizado no próximo
        // render — então lemos direto da resposta pra decidir se já pronto.
        const resp2 = await fetch(`${WORKER_URL}/avisos`);
        const data2 = await resp2.json();
        const pronto = CATEGORIAS_AVISOS.every((c) => data2[c.id] && data2[c.id].atualizadoEm);
        if (pronto) {
          setForcarMensagem("Pronto! Atualizações geradas.");
          setTimeout(() => setForcarMensagem(""), 4000);
        } else if (tentativas < maxTentativas) {
          setForcarMensagem(`Ainda gerando… verificando de novo (${tentativas}/${maxTentativas}). Pode navegar por outras abas enquanto isso.`);
          setTimeout(verificar, 10000);
        } else {
          setForcarMensagem("Demorou mais que o esperado. Toque em \"Atualizar\" daqui a pouco pra conferir.");
        }
      };
      setTimeout(verificar, 10000);
    } catch (e) {
      setForcarMensagem(`Não consegui disparar a atualização. ${e.message || ""}`);
    } finally {
      setForcandoAtualizacao(false);
    }
  }

  async function buscarLegislacao() {
    if (!legislacaoQuery.trim()) return;

    const systemBusca = `Você ajuda um policial militar a consultar rapidamente qualquer legislação brasileira em vigor (federal ou estadual) relevante para sua atuação — não se limite a um código específico.

Use a ferramenta de busca para localizar a informação em fontes oficiais (prioridade: planalto.gov.br/ccivil_03, ou o site oficial do respectivo diploma legal).

Se não encontrar nada confiável, diga isso claramente.`;

    const systemFormatar = (textoBruto) => `Converta o texto abaixo em um JSON válido (sem markdown, sem crases), no formato exato:

Texto para converter:
"""
${textoBruto}
"""`;

    try {
      const dataBusca = await callClaude(deviceId, {
        system: systemBusca,
        messages: [{ role: "user", content: legislacaoQuery }],

      setLegislacaoFase("Organizando…");

      try {

          system: systemFormatar(textoBruto),
          messages: [{ role: "user", content: "Converta agora." }],
          maxTokens: 800,
          model: "claude-haiku-4-5-20251001",
        });
        setLegislacaoResultado(extractJsonFromResponse(dataFormatada));
      } catch (erroFormatacao) {
        // Se não conseguir estruturar em JSON, mostra o texto puro da busca
        setLegislacaoResultado({ fonte: "Busca", artigo: "", texto_lei: "", explicacao: textoBruto });
      }
    } catch (e) {
      setLegislacaoError(`Não consegui buscar agora. ${e.message || ""}`);
    } finally {
      setLegislacaoLoading(false);
    }
  }

                <div style={styles.sectionHeaderRow}>
                  <div style={styles.panelLabel}>{categoria.label}</div>
                  {estado.atualizadoEm && (
                    <span style={styles.sectionHeaderMeta}>Atualizado às {estado.atualizadoEm.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</span>
                  )}
                </div>
                {!estado.itens && avisosLoading && <p style={styles.emptyText}>Carregando…</p>}
                {estado.itens && estado.itens.length === 0 && !estado.atualizadoEm && (
                  <div style={styles.emptyBox}>Ainda não há atualizações nesta categoria. Volte mais tarde.</div>
                )}
                {estado.itens && estado.itens.length === 0 && estado.atualizadoEm && (
                  <div style={styles.emptyBox}>Nada de relevante encontrado por agora.</div>
                )}
                {estado.itens && estado.itens.length > 0 && (
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {(avisosAbertos[categoria.id] ? estado.itens : estado.itens.slice(0, 2)).map((item, i) => (
                      <div key={i} className="mk-card" style={styles.avisoCard}>
                        <span style={{ ...styles.avisoTag, background: categoria.cor }}>{item.fonte}</span>
                        <p style={styles.avisoTitulo}>{item.titulo}</p>
                        <p style={styles.avisoResumo}>{item.resumo}</p>
                        {item.url && item.url !== "null" && urlSegura(item.url) && <a href={urlSegura(item.url)} target="_blank" rel="noreferrer" style={styles.sourceLink}>Ver fonte →</a>}
                      </div>
                    ))}
                    {estado.itens.length > 2 && (
                      <button style={styles.ghostButton} onClick={() => setAvisosAbertos({ ...avisosAbertos, [categoria.id]: !avisosAbertos[categoria.id] })}>
                        {avisosAbertos[categoria.id] ? "Ver menos" : `Ver mais (${estado.itens.length - 2})`}
                      </button>
                    )}
                  </div>
                )}
              </section>
            );
          })}
        </div>
      )}

      {activeTab === "ferramentas" && (
        <>
        <section className="mk-panel" style={{ ...styles.panel, borderLeftColor: "#8a8f98" }}>

          <p style={styles.disclaimer}>As consultas acontecem no site/app oficial, autenticadas por você. Nenhum dado passa pelo Mike Assist.</p>
        </section>

            </p>
            {APPS_OFICIAIS_PMERJ.map((app) => (
              <a key={app.nome} href={app.link} target="_blank" rel="noopener noreferrer"

                  display: "flex", alignItems: "center", gap: 12, padding: "12px 10px",

                  background: "var(--bg-chip)", border: "1px solid var(--border)",
                }}>

                  width: 38, height: 38, borderRadius: 10, overflow: "hidden", flexShrink: 0,
                }}>
                  <img src={app.icone} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 700, color: "var(--text)" }}>{app.nome}</div>
                  <div style={{ fontSize: 11.5, color: "var(--text-muted)", marginTop: 2, lineHeight: 1.4 }}>{app.descricao}</div>
                </div>
                <div style={{ fontSize: 16, color: "var(--text-dim)", flexShrink: 0 }}>›</div>
              </a>
            ))}
          </section>

          <section className="mk-panel" style={{ ...styles.panel, borderLeftColor: "#c9a24a" }}>
            <div style={styles.panelLabel}>Outros apps úteis</div>
            <p style={{ fontSize: 12, color: "var(--text-muted)", marginTop: 4, marginBottom: 12 }}>
              Apps de terceiros recomendados — não têm vínculo com a PMERJ/SEPM nem com o Mike Assist.
            </p>
            {APPS_TERCEIROS.map((app) => (
              <a key={app.nome} href={app.link} target="_blank" rel="noopener noreferrer"
                style={{
                  display: "flex", alignItems: "center", gap: 12, padding: "12px 10px",
                  borderRadius: 12, textDecoration: "none", marginBottom: 8,
                  background: "var(--bg-chip)", border: "1px solid var(--border)",
                }}>
                <div style={{
                  width: 38, height: 38, borderRadius: 10, overflow: "hidden", flexShrink: 0,
                }}>
                  <img src={app.icone} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 700, color: "var(--text)" }}>{app.nome}</div>
                  <div style={{ fontSize: 11.5, color: "var(--text-muted)", marginTop: 2, lineHeight: 1.4 }}>{app.descricao}</div>
                </div>
                <div style={{ fontSize: 16, color: "var(--text-dim)", flexShrink: 0 }}>›</div>
              </a>
            ))}
          </section>
        </>
      )}

      {activeTab === "legislacao" && (
        <section className="mk-panel" style={{ ...styles.panel, borderLeftColor: "#a13b46" }}>
          <AvisoIndependente />
          <div style={styles.panelLabel}>Consultar legislação em vigor</div>
          <input value={legislacaoQuery} onChange={(e) => setLegislacaoQuery(e.target.value)}

            style={{ ...styles.input, width: "100%", marginTop: 8 }}
            onKeyDown={(e) => e.key === "Enter" && buscarLegislacao()} />
          <button style={{ ...styles.primaryButton, width: "100%", marginTop: 10, opacity: legislacaoLoading || !legislacaoQuery.trim() ? 0.6 : 1 }}
            onClick={buscarLegislacao} disabled={legislacaoLoading || !legislacaoQuery.trim()}>

            <div style={{ marginTop: 12 }}>
              {legislacaoResultado.texto_lei ? (
                <>
                  <div style={styles.codeTag}>
                    <span style={styles.mono}>{legislacaoResultado.fonte}</span>
                    <span style={{ opacity: 0.75 }}>{legislacaoResultado.artigo}</span>

                    <div style={{ marginTop: 10 }}>
                      <div style={styles.suggestionsLabel}>Na prática</div>
                      <p style={styles.avisoResumo}>{legislacaoResultado.explicacao}</p>

                </>

            </div>
          )}

          <p style={{ fontSize: 13, lineHeight: 1.6, margin: "0 0 10px" }}>

          </p>

          <div style={styles.suggestionsLabel}>Fontes oficiais das informações</div>
          <p style={{ fontSize: 12, lineHeight: 1.6, color: "var(--text-muted)", margin: "6px 0 8px" }}>
            As informações jurídicas e institucionais exibidas no app têm como base as fontes oficiais abaixo. Confira sempre a redação vigente nelas:
          </p>
          <ul style={{ fontSize: 13, lineHeight: 1.9, margin: "0 0 10px", paddingLeft: 20 }}>
            <li><a href="https://www.planalto.gov.br/ccivil_03/" target="_blank" rel="noopener noreferrer" style={{ color: "#c9a24a" }}>Legislação federal — planalto.gov.br</a></li>
            <li><a href="https://www.alerj.rj.gov.br" target="_blank" rel="noopener noreferrer" style={{ color: "#c9a24a" }}>Legislação estadual — alerj.rj.gov.br</a></li>
            <li><a href="https://sepm.rj.gov.br" target="_blank" rel="noopener noreferrer" style={{ color: "#c9a24a" }}>Secretaria de Estado de Polícia Militar — sepm.rj.gov.br</a></li>
            <li><a href="https://sepm.rj.gov.br/sistema-corporativo/bopm/" target="_blank" rel="noopener noreferrer" style={{ color: "#c9a24a" }}>Sistema BOPM oficial — sepm.rj.gov.br</a></li>
          </ul>

          <p style={styles.disclaimer}>
            Gratuito e mantido de forma independente. Nenhuma ocorrência digitada é salva; não há login nem cadastro. Contato: mikeassist.suporte@gmail.com
          </p>
        </section>

        <section className="mk-panel" style={{ ...styles.panel, borderLeftColor: "#4f8f6d" }}>
          <div style={styles.panelLabel}>Suporte e sugestões</div>
          <a
            href="mailto:mikeassist.suporte@gmail.com?subject=Sugest%C3%A3o%20-%20Mike%20Assist&body=Sugest%C3%A3o%2Fideia%3A%0A%0A"
            style={{ display: "flex", alignItems: "center", gap: 12, textDecoration: "none", color: "var(--text)", marginTop: 10 }}
          >
            <div style={{
              width: 42, height: 42, borderRadius: "50%", flexShrink: 0,
              background: "rgba(79,143,109,0.16)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 19,
            }}>
              🛡️
            </div>
            <div>
              <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 15, fontWeight: 700 }}>
                Suporte
                <span style={{
                  display: "inline-flex", alignItems: "center", justifyContent: "center",
                  width: 15, height: 15, borderRadius: "50%", background: "#5b8bc9",
                  color: "#fff", fontSize: 9, fontWeight: 700, lineHeight: 1,
                }}>✓</span>
              </div>
              <div style={{ fontSize: 12.5, color: "var(--text-muted)", marginTop: 1 }}>Fale com o suporte</div>
            </div>
          </a>
        </section>

          {PIX_KEY_DOACAO && (
        <section className="mk-panel" style={{ ...styles.panel, borderLeftColor: "#c9a24a" }}>
          <div style={styles.panelLabel}>Apoie o projeto</div>
          <p style={{ fontSize: 13, color: "#c3cbd3", lineHeight: 1.6, margin: "6px 0 16px" }}>
            Se te ajudou, contribua para a melhora do aplicativo.
          </p>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, alignItems: "center" }}>
            <button style={{ ...styles.primaryButton, width: "100%" }} onClick={copiarChavePix}>{pixCopyLabel}</button>
            <button style={{ ...styles.ghostButton, width: "100%" }} onClick={() => setMostrarQr(!mostrarQr)}>{mostrarQr ? "Ocultar QR Code" : "Mostrar QR Code"}</button>
            {mostrarQr && <QRCodeDonacao />}
          </div>
          <p style={styles.disclaimer}>Doação totalmente opcional, via Pix. Nenhum recurso do app é liberado em troca.</p>
        </section>
          )}
        </>
      )}
    </div>
  );
}
